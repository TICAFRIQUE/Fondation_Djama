name: Déploiement

# Push sur main (ou bouton « Run workflow ») : tests, puis envoi du code et de vendor/
# (sans les paquets de dev) en rsync sur le serveur.
# Le .env, storage/ (images envoyées depuis l'admin, sauvegardes, journaux) et le lien
# public/storage du serveur ne sont jamais touchés.
#
# Pas d'étape Node/Vite : le site n'utilise pas Vite, et « npm run build » viderait
# public/build, qui contient les fichiers versionnés du gabarit de l'admin.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Jamais deux déploiements en même temps, jamais d'interruption en cours.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    # Base SQLite en mémoire : fixée par phpunit.xml, reprise ici pour les commandes artisan.
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, curl, intl, fileinfo, gd, exif
          coverage: none

      - name: Installer les dépendances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Exécuter les tests
        run: php artisan test --compact

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    environment: PRODUCTION
    if: github.ref == 'refs/heads/main'
    env:
      SERVEUR: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
      DOSSIER: ${{ secrets.SERVER_PATH }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      # PHP 8.3 en ligne de commande sur le serveur (ex. /opt/cpanel/ea-php83/root/usr/bin/php).
      PHP: ${{ vars.PHP_BIN || 'php' }}
    steps:
      # ── 1. Récupérer le code ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. PHP + Composer (dépendances de production uniquement) ─────
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, xml, curl, bcmath, intl, gd, exif
          coverage: none

      # « package:discover » démarre l'application : une base en mémoire lui suffit.
      - name: Installer les dépendances Composer (prod only)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      # ── 3. Connexion SSH ─────────────────────────────────────────────
      - name: Configurer SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -p "$SSH_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Serveur injoignable sur $SERVER_HOST:$SSH_PORT (adresse, port SSH, ou pare-feu de l'hébergeur qui bloque GitHub)."
            exit 1
          fi
          cat > ~/.ssh/config <<EOF
          Host $SERVER_HOST
            Port $SSH_PORT
            ConnectTimeout 20
            BatchMode yes
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            PubkeyAcceptedAlgorithms +ssh-rsa
            KexAlgorithms +diffie-hellman-group-exchange-sha256
            ServerAliveInterval 30
          EOF

      # Échec : relance en mode détaillé pour afficher la cause exacte.
      - name: Tester la connexion SSH
        run: |
          if ! ssh "$SERVEUR" "echo 'Connexion SSH OK' && command -v $PHP && $PHP -v | head -n 1 && command -v rsync"; then
            echo "::error::Connexion SSH refusée ou rsync absent : voir le détail ci-dessous."
            ssh -v "$SERVEUR" true 2>&1 | grep -vE '^debug1: (Reading|Applying|identity file|Local version|compat_|kex: |Remote protocol|SSH2_MSG|expecting|rekey|channel|client_input|pledge|Sending env|Requesting|Entering|Exit status)' || true
            exit 1
          fi
          if ! ssh "$SERVEUR" "$PHP -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);'"; then
            echo "::error::« $PHP » n'est pas PHP 8.3 ou plus sur le serveur. Créer la variable PHP_BIN (ex. /opt/cpanel/ea-php83/root/usr/bin/php) dans l'environnement PRODUCTION."
            exit 1
          fi

      # ── 4. Contrôle du .env puis mise en maintenance ─────────────────
      # .env absent ou dangereux : arrêt avant toute coupure, site non touché.
      # Première installation, ou version en ligne qui plante : le déploiement
      # continue, c'est lui qui la répare.
      - name: Mise en maintenance
        run: |
          ssh "$SERVEUR" "bash -s" <<EOF
            set -e
            mkdir -p '$DOSSIER'
            cd '$DOSSIER'
            test -f .env || { echo "::error::.env absent dans $DOSSIER : le créer d'abord à partir de .env.example (APP_ENV=production, APP_DEBUG=false, APP_KEY, APP_URL, base MySQL, e-mail)."; exit 1; }
            if grep -qiE '^APP_DEBUG="?true' .env; then
              echo "::error::APP_DEBUG=true dans le .env du serveur : passer à false avant de déployer (les erreurs afficheraient des secrets)."
              exit 1
            fi
            if ! grep -qE '^APP_KEY="?base64:' .env; then
              echo "::error::APP_KEY absente du .env du serveur : la générer avec « php artisan key:generate --show » et la coller dans le .env."
              exit 1
            fi
            if [ ! -f artisan ]; then
              echo "Première installation : aucun code en ligne."
              exit 0
            fi
            # Caches régénérés ensuite ; d'anciens caches (paquets de dev…) feraient planter artisan.
            find bootstrap/cache -maxdepth 1 -name '*.php' -delete 2>/dev/null || true
            $PHP artisan down --retry=60 || echo "::warning::Mise en maintenance impossible sur la version en ligne : le déploiement la remplace."
          EOF

      # ── 5. Envoi des fichiers via rsync ──────────────────────────────
      # Les chemins exclus ne sont jamais supprimés par --delete : .env, storage/
      # (images de l'admin) et le lien public/storage restent intacts sur le serveur.
      # Le .htaccess racine du serveur est conservé : l'hébergeur y inscrit la version
      # de PHP choisie dans cPanel, qu'un écrasement ferait disparaître.
      - name: Déployer via rsync
        run: |
          rsync -az --delete --stats \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.env' \
            --exclude='/.htaccess' \
            --exclude='/node_modules/' \
            --exclude='/tests/' \
            --exclude='/storage/' \
            --exclude='/bootstrap/cache/' \
            --exclude='/database/*.sqlite*' \
            --exclude='/public/storage' \
            --exclude='/public/hot' \
            --exclude='/.claude/' --exclude='/.vscode/' --exclude='/.idea/' \
            --exclude='/.well-known/' --exclude='/cgi-bin/' \
            --exclude='/public/.well-known/' --exclude='/public/cgi-bin/' \
            --exclude='.user.ini' --exclude='php.ini' --exclude='error_log' \
            ./ "$SERVEUR:$DOSSIER/"
          # Déposé seulement s'il n'existe pas encore sur le serveur (première installation).
          rsync -az --ignore-existing .htaccess "$SERVEUR:$DOSSIER/"

      # ── 6. Commandes post-déploiement ────────────────────────────────
      # Un échec laisse le site en maintenance : une base à moitié migrée
      # ne doit jamais servir.
      - name: Post-deploy (migrations, contenus, caches)
        run: |
          ssh "$SERVEUR" "bash -s" <<EOF
            set -e
            cd '$DOSSIER'
            mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs storage/app/public storage/app/private bootstrap/cache
            # Caches de l'ancienne version (paquets, config, routes) : supprimés avant
            # tout appel à artisan, qui planterait sur un paquet retiré de vendor/.
            find bootstrap/cache -maxdepth 1 -name '*.php' -delete
            # Migrations d'abord : cache:clear (dans optimize:clear) écrit dans la
            # table cache, absente d'une base neuve. Elles créent aussi les permissions
            # des écrans d'admin.
            $PHP artisan migrate --force
            # Contenus par défaut, puis contenus d'exemple : ils ne remplissent que les rubriques
            # vides et ne modifient jamais un contenu existant, donc sans effet après la première fois.
            # Toujours avec --class : « db:seed » seul viderait utilisateurs, rôles et permissions.
            $PHP artisan db:seed --class=SiteContentSeeder --force
            $PHP artisan db:seed --class=SiteExampleSeeder --force
            # Lien public/storage -> storage/app/public : sans lui, aucune image de l'admin ne s'affiche.
            if [ ! -e public/storage ]; then
              $PHP artisan storage:link
            fi
            $PHP artisan optimize:clear
            $PHP artisan optimize
            $PHP artisan up
          EOF

      - name: Nettoyage
        if: always()
        run: rm -f ~/.ssh/deploy_key
